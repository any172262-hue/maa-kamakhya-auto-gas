<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" fill="none">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="50%" stop-color="#FFD52A" />
      <stop offset="100%" stop-color="#E5B800" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1677FF" />
      <stop offset="100%" stop-color="#55A4FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aerodynamic Car Silhouette -->
  <g transform="translate(200, 4)" stroke="url(#yellowGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hood to Roof to Rear -->
    <path d="M-80 34 C-50 34, -30 24, 0 16 C30 8, 80 8, 110 16 C140 24, 160 34, 190 34" />
    <!-- Cabin Window Contour -->
    <path d="M-20 23 C10 13, 70 13, 100 23 C85 17, 30 17, -5 23 Z" fill="rgba(85, 164, 255, 0.25)" />
    <!-- Speed Wings Behind -->
    <line x1="-100" y1="34" x2="-80" y2="34" stroke="url(#blueGrad)" stroke-width="2" />
    <line x1="-90" y1="29" x2="-75" y2="29" stroke="url(#blueGrad)" stroke-width="1.8" />
    <line x1="190" y1="34" x2="210" y2="34" stroke="url(#blueGrad)" stroke-width="2" />
  </g>

  <!-- Brand Typography: MAA -->
  <text x="25" y="74" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="url(#yellowGrad)" filter="url(#neonGlow)">
    MAA
  </text>

  <!-- Brand Typography: KAMAKHYA -->
  <text x="135" y="74" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
    KAMAKHYA
  </text>

  <!-- Brand Typography: AUTO GAS -->
  <text x="400" y="74" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="url(#blueGrad)">
    AUTO GAS
  </text>

  <!-- Decorative Energy / CNG Accent Line -->
  <line x1="20" y1="84" x2="595" y2="84" stroke="url(#yellowGrad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="308" cy="84" r="4.5" fill="#FFD52A" stroke="#07152C" stroke-width="2" />

  <!-- Subtitle Tagline -->
  <text x="308" y="103" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#B7C5DC" text-anchor="middle">
    EXPERT CARE • BETTER PERFORMANCE • COMPLETE PEACE OF MIND
  </text>
</svg>
